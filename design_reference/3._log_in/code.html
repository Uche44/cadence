ify-between items-center px-margin pt-space-xs text-on-surface text-[14px] font-semibold tracking-tight"><span class="w-12">9:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[18px]">battery_full</span></div></div></div><main class="flex-1 flex flex-col relative w-full px-margin pb-safe bg-surface"><div class="flex flex-col w-full pb-space-2xl">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between py-space-sm mb-space-md">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<div class="w-12 h-12"></div>
</div>
<!-- Brand Emblem & Welcome Header -->
<div class="flex flex-col items-center text-center px-space-xs mb-space-xl">
<div class="relative w-16 h-16 mb-space-md p-space-2xs bg-surface-container-low rounded-full flex items-center justify-center shadow-sm">
<img alt="Cadence Logo" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida/ALJJyrCnhp6nqYeedUCYBNbRbBR-LrisuI6OItjChOfPqejFRm22PkNAVfZDcUnenuGJGCXACbJZdeEP-NcTGw4cG86RrUyF2KeUTWu6urjhWTBzhidtlhFOAdBW9yhMnUTF4J9UFmLThhcbLRsJ8RHZgBo-QrfMjEKIvfVHbGFETVN2cFYsPtHzsuSXhyU76ATygaaADvOIRKROU4G1T7jCwjpeAhuhG2mlPrC1V3HBKx9IPQ"/>
</div>
<h1 class="font-display-lg text-display-lg-mobile text-on-surface tracking-tight mb-space-xs">
      Welcome back
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      Continue your gentle daily pace with Sandra’s routine.
    </p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest text-on-surface p-6 rounded-[28px] shadow-sm flex flex-col gap-space-lg mb-space-xl">
<!-- Email Field -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface-variant px-space-xs" for="email">
        Email address
      </label>
<div class="relative flex items-center">
<input class="w-full h-13 px-space-lg font-body-md text-body-md bg-surface-container-low text-on-surface rounded-full focus:outline-none focus:bg-surface-container transition-colors" id="email" placeholder="Enter your email" type="email" value="sandra.rn@example.com"/>
<span class="material-symbols-outlined absolute right-space-lg text-[20px] text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">
          check_circle
        </span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-2xs">
<label class="font-label-md text-label-md text-on-surface-variant px-space-xs" for="password">
        Password
      </label>
<div class="relative flex items-center">
<input class="w-full h-13 pl-space-lg pr-12 font-body-md text-body-md bg-surface-container-low text-on-surface rounded-full focus:outline-none focus:bg-surface-container tracking-widest transition-colors" id="password" placeholder="Enter your password" type="password" value="••••••••••••"/>
<button aria-label="Toggle password visibility" class="absolute right-space-sm flex items-center justify-center w-10 h-10 rounded-full text-on-surface-variant active:opacity-70 transition-opacity" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-space-2xs px-space-xs">
<button class="font-label-lg text-label-lg text-secondary active:opacity-80 transition-opacity" type="button">
          Forgot password?
        </button>
</div>
</div>
<!-- Main Submission Action -->
<div class="flex flex-col pt-space-xs">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-label-lg text-label-lg shadow-md flex items-center justify-center gap-space-xs active:scale-[0.98] transition-transform" type="button">
<span>Log in</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Quick Sign-in Divider -->
<div class="relative flex items-center justify-center py-space-2xs">
<div class="w-full h-[1px] bg-surface-container"></div>
<span class="absolute bg-surface-container-lowest px-space-md font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">
        or quick biometric
      </span>
</div>
<!-- Face ID Biometric Action -->
<button class="w-full h-13 bg-surface-container-low text-on-surface rounded-full font-label-lg text-label-lg flex items-center justify-center gap-space-sm active:scale-[0.98] active:bg-surface-container transition-all" id="biometricBtn" type="button">
<span class="material-symbols-outlined text-[22px] text-secondary">face</span>
<span>Sign in with Face ID</span>
</button>
</div>
<!-- Warm Reassuring Micro-Badge -->
<div class="flex items-center justify-center gap-space-xs px-space-md py-space-sm rounded-full bg-secondary-container text-on-secondary-container mx-auto mb-space-xl">
<span class="material-symbols-outlined text-[18px]">energy_savings_leaf</span>
<span class="font-label-sm text-label-sm">Safe &amp; calibrated to Sandra's energy pace</span>
</div>
<!-- Sign Up Footer Route -->
<div class="flex items-center justify-center gap-space-2xs text-center">
<span class="font-body-md text-body-md text-on-surface-variant">Don’t have an account?</span>
<button class="font-label-lg text-label-lg text-on-surface font-semibold underline underline-offset-4 active:opacity-75 transition-opacity" type="button">
      Sign up
    </button>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const biometricBtn = document.getElementById('biometricBtn');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
        if (isPassword) {
          passwordInput.classList.remove('tracking-widest');
        } else {
          passwordInput.classList.add('tracking-widest');
        }
      });
    }

    if (biometricBtn) {
      biometricBtn.addEventListener('click', () => {
        const originalContent = biometricBtn.innerHTML;
        biometricBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Authenticating...</span>';
        setTimeout(() => {
          biometricBtn.innerHTML = '<span class="material-symbols-outlined text-green-600 text-[20px]" style="font-variation-settings: \'FILL\' 1;">check_circle</span><span>Authenticated</span>';
          setTimeout(() => {
            biometricBtn.innerHTML = originalContent;
          }, 1200);
        }, 900);
      });
    }
  })();
</script></main></body></html>
